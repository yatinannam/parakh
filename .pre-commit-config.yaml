repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-emoji
        name: no emoji in tracked files
        entry: uv run python -m tools.no_emoji
        language: system
        pass_filenames: false
      - id: kg-sync
        name: knowledge-graph views in sync
        entry: uv run python -m tools.kg_render --check
        language: system
        pass_filenames: false
        files: ^docs/kg/
