[project]
name = "parakh"
version = "0.0.1"
description = "Test voice agents on Indian speech: Hinglish code-mixing, phone-quality audio and interruptions."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yatin Annam" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "edge-tts>=7.3",
    "jiwer>=4.0",
    "indic-transliteration>=2.3.80",
    "websockets>=15",
    "loguru>=0.7",
    "pipecat-ai==1.16.0",
    "jinja2>=3.1",
    "psutil>=6",
]

[project.scripts]
parakh = "parakh.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5",
]
agent = [
    "pipecat-ai[websocket,silero,groq]==1.16.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parakh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Any warning fails the suite, in CI and locally; narrow per-test filters still apply.
filterwarnings = ["error"]
markers = [
    "integration: tests that need network access or real services",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff formats Python blocks inside Markdown; docs hold illustrative snippets, not project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tools", "tests", "agents"]
exclude = ["tools/calibrate_eval"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
