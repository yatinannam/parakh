# Golden pairs for the script-tolerant normaliser (spec 6.7).
#
# Each pair is [a, b, group]. test_must_match and test_must_not_match read a and b only;
# test_golden_counts reads the group. Groups:
#   hinglish  Hinglish words and phrases, Devanagari against Roman
#   loanword  English words written in Devanagari (EC-42)
#   variant   Roman spelling variants
#   number    number words, digit groups and Devanagari numerals (EC-44)
#   no_match  words that must stay distinct (EC-43 and near misses)
#
# Pairs marked "observed" come from how Groq Whisper (language hi) wrote the synthetic
# caller in local clean and phone runs.
#
# A pair the normaliser gets wrong goes to known_gaps with its reason; each known gap is an
# xfail(strict=True) test, so fixing one fails the suite until the pair moves up. Never
# delete a pair.

