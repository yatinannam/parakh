known_gaps:
  - { a: "up", b: "अप", expect: match, why: "a variant ap would merge up with aap (you)" }
  - { a: "follow up", b: "फॉलो अप", expect: match, why: "observed; अप reads ap, and a variant ap would merge up with aap (you)" }
  - { a: "check up", b: "चेक अप", expect: match, why: "अप reads ap, and a variant ap would merge up with aap (you)" }
  - { a: "terah", b: "13", expect: match, why: "terah loses its final h and reads tera, which is also tera (your); 13 is left out of the number words so that tera never becomes a digit" }
  - { a: "साठ", b: "60", expect: match, why: "साठ (60) and साथ (with) both read sath, and saath (with) is far more common, so 60 is left out of the number words" }
  - { a: "aapka", b: "आपका", expect: match, why: "ITRANS keeps the medial schwa (apaka against apka), and the consonant skeleton pk is too short for the fallback" }
  - { a: "woh", b: "वह", expect: match, why: "वह reads vah, the same key as वाह (wow); a variant vah to vo would merge them" }
  - { a: "9611223344", b: "9611 तू तू थी 344", expect: match, why: "observed; Whisper wrote English two as तू and three as थी, which are common Hindi words (you, was), so they are not number words" }
