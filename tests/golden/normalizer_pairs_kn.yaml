# Golden pairs for the script-tolerant normaliser, Kannada-English (spec 6.7, language kn-en).
#
# Each pair is [a, b, group]. test_golden_kn compares a and b with normalize(x, "kn-en");
# test_golden_counts_kn_ta reads the group. Groups:
#   script    Kannada script against Roman
#   loanword  English words written in Kannada script
#   variant   Roman spelling variants
#   number    number words, digit groups and Kannada numerals
#   no_match  words that must stay distinct
#
# Pairs marked "textbook" come from the M3b scenario vocabulary and common spellings. Pairs
# marked "observed" come from how Groq Whisper (language kn) wrote the synthetic caller in
# the M3b clean runs. Only spellings of the word that was said become pairs; a transcript of
# a different word (Nail for naale, Allah for illa) is a recognition error, not a pair.
#
# A pair the normaliser gets wrong goes to known_gaps with its reason; each known gap is an
# xfail(strict=True) test, so fixing one fails the suite until the pair moves up. Never
# delete a pair.

