known_gaps:
  - { a: "gante ge", b: "ಗಂಟೆಗೆ", expect: match, why: "textbook; the Roman reference writes the case suffix ge apart, and words are compared one by one" }
  - { a: "beku", b: "bekku", expect: no_match, why: "textbook; the double-letter rule reads bekku (cat) as beku (want)" }
  - { a: "sorry", b: "ಸಾರಿ", expect: match, why: "textbook; ಸಾರಿ reads sari, the key of ಸರಿ (right), so a variant to sori would merge them" }
  - { a: "early", b: "ಅರ್ಲಿ", expect: match, why: "textbook; ಅರ್ಲಿ reads arli, and the consonant skeleton rl is too short for the fallback" }
  - { a: "ten thirty", b: "ಟೆನ್ ಥರ್ಟಿ", expect: match, why: "textbook; English tens in Kannada script are not number words, so ಥರ್ಟಿ stays tharti" }
  - { a: "ellu", b: "elu", expect: no_match, why: "textbook; the double-letter rule reads ellu (sesame) as elu, which is 7" }
  - { a: "ಬಾಯಿ", b: "ಬೈ", expect: no_match, why: "textbook; y between two different vowels drops, so ಬಾಯಿ (mouth) reads bai, the same as ಬೈ (bye)" }
  - { a: "ಕಾಲು", b: "ಕಲ್ಲು", expect: no_match, why: "textbook; vowel length and double letters collapse, so ಕಾಲು (leg) and ಕಲ್ಲು (stone) both read kalu" }
  - { a: "ಕತ್ತು", b: "ಕಟ್ಟು", expect: no_match, why: "textbook; ITRANS case is lowercased and doubles collapse, so the dental ತ and retroflex ಟ merge: ಕತ್ತು (neck) and ಕಟ್ಟು (tie) both read katu (R9)" }
  - { a: "ಹಾಲು", b: "ಹಾಳು", expect: no_match, why: "textbook; ಳ reads L, which lowercases to l, so ಹಾಲು (milk) and ಹಾಳು (ruin) both read halu (R9)" }
  - { a: "jotege", b: "jyotaj", expect: match, why: "observed; Whisper's Roman jyotaj drops the final e and writes g as j, so the skeleton jtj is not jtg" }
  - { a: "rao hattira", b: "ರಾವಹತ್ತಿರ", expect: match, why: "observed; Whisper joined the two words, and words are compared one by one" }
  - { a: "8095127364", b: "8095. 1 to 7 3 6 4", expect: match, why: "observed; Whisper wrote English two as to, a common English word, so it is not a number word" }
