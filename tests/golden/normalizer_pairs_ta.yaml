known_gaps:
  - { a: "பாத்து", b: "பத்து", expect: no_match, why: "textbook; vowel length collapses, so paathu (having seen) reads pathu, which is 10" }
  - { a: "பால்", b: "பல்", expect: no_match, why: "textbook; vowel length collapses, so paal (milk) reads pal (tooth)" }
  - { a: "kaalai", b: "kalai", expect: no_match, why: "textbook; vowel length collapses, so kaalai (morning) reads kalai (art)" }
  - { a: "kudu", b: "kuttu", expect: no_match, why: "textbook; ta-en voicing and the double-letter rule read kudu (give) and kuttu (sting) as kutu" }
  - { a: "phone", b: "போன்", expect: match, why: "textbook; போன் reads pon, and a variant pon to fon would merge it with pon (gold)" }
  - { a: "nandri", b: "nanri", expect: match, why: "textbook; the literary spelling nanri has no d for the ndr that ன்ற reads as, and the skeleton nnr is too short" }
  - { a: "விடு", b: "வீடு", expect: no_match, why: "textbook; vowel length and ta-en voicing collapse, so vidu (leave) and veedu (house) both read vitu" }
  - { a: "எடு", b: "எட்டு", expect: no_match, why: "textbook; ta-en voicing and the double-letter rule read edu (take) as ettu, which is 8" }
  - { a: "seri", b: "saree", expect: no_match, why: "textbook; the variant seri to sari (சரி) also catches saree, the garment" }
  - { a: "thambi", b: "tambi", expect: match, why: "textbook; Roman t for the dental த reads as the retroflex series, which ta-en keeps apart from th (R6), and the skeletons thmp and tmp differ" }
  - { a: "do", b: "to", expect: no_match, why: "textbook; the ta-en voicing collapse (d to t) merges English words that differ only in voicing (R8)" }
  - { a: "bill", b: "pill", expect: no_match, why: "textbook; the ta-en voicing collapse (b to p) merges English words that differ only in voicing (R8)" }
  - { a: "drug", b: "truck", expect: no_match, why: "textbook; the ta-en voicing collapse (d to t, g to k) merges English words that differ only in voicing (R8)" }
  - { a: "பள்ளி", b: "பல்லி", expect: no_match, why: "textbook; ள and ல both read l, so பள்ளி (school) and பல்லி (lizard) both read pali (R9)" }
