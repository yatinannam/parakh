# Golden pairs for the script-tolerant normaliser, Tamil-English (spec 6.7, language ta-en).
#
# Each pair is [a, b, group]. test_golden_ta compares a and b with normalize(x, "ta-en");
# test_golden_counts_kn_ta reads the group. Groups:
#   script    Tamil script against Roman
#   loanword  English words written in Tamil script
#   variant   Roman spelling variants
#   number    number words, digit groups and Tamil numerals
#   no_match  words that must stay distinct
#
# ta-en keys collapse voicing within each series, because Tamil script does not mark voicing
# and Roman spellings differ there: b and bh to p, g to k, d to t (retroflex), dh to th
# (dental), sh and ch to s. th and t stay apart, and so do zh and l (controller ruling R6).
# The collapse does merge one class of distinct words: English words that differ only in
# voicing (do and to, bill and pill, drug and truck). Those are known gaps (ruling R8), as is
# ள read as l, like ல (ruling R9).
#
# Every pair is "textbook": it comes from the M3b scenario vocabulary and common spellings,
# not from a Whisper transcript. No Whisper transcript of Tamil exists yet; live runs add
# observed pairs later.
#
# A pair the normaliser gets wrong goes to known_gaps with its reason; each known gap is an
# xfail(strict=True) test, so fixing one fails the suite until the pair moves up. Never
# delete a pair.

